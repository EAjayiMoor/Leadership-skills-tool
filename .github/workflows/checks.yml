name: UI checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build production container
        run: docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" --tag leadership-assessment:ci .
      - name: Start production container
        run: |
          docker run --detach --name leadership-ci --publish 127.0.0.1:3100:8080 leadership-assessment:ci
          curl --silent --show-error --fail --output /dev/null --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:3100/
          curl --silent --show-error --fail http://127.0.0.1:3100/_deployment.json | jq --exit-status --arg commit "$GITHUB_SHA" '.sourceCommit == $commit'
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3100
      - name: Package verified standalone app for Azure Node hosting
        run: |
          mkdir azure-package
          docker cp leadership-ci:/app/. azure-package/
          (cd azure-package && zip -qry ../leadership-assessment-azure.zip .)
          sha256sum leadership-assessment-azure.zip > leadership-assessment-azure.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: leadership-assessment-azure
          retention-days: 14
          path: |
            leadership-assessment-azure.zip
            leadership-assessment-azure.zip.sha256
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs leadership-ci || true
          docker rm --force leadership-ci || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-check-results
          path: |
            test-results/
            playwright-report/
